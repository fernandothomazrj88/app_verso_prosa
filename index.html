<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verso & Prosa">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="description" content="Verso & Prosa — uma biblioteca particular para duas jornadas de leitura.">
<title>Verso &amp; Prosa — Biblioteca Literária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=modular-v54">
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="vp-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/></symbol>
  <symbol id="vp-shelf" viewBox="0 0 24 24"><path d="M3 4h18v16H3zM8 4v16m8-16v16M5 8h1m9 4h1"/><path d="M5 4v16m14-16v16"/></symbol>
  <symbol id="vp-book" viewBox="0 0 24 24"><path d="M12 7v14M12 7C9 4 5 4 2 5v14c4-1 7-1 10 2m0-14c3-3 7-3 10-2v14c-4-1-7-1-10 2"/><path d="M5 9c2-.5 4 0 5 1m9-1c-2-.5-4 0-5 1"/></symbol>
  <symbol id="vp-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="vp-pen" viewBox="0 0 24 24"><path d="m4 20 4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11Z"/><path d="m14.5 6.5 3 3M4 20l1-4"/></symbol>
  <symbol id="vp-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
  <symbol id="vp-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M7 3v4m10-4v4M3 10h18M8 14h2m4 0h2m-8 3h2"/></symbol>
  <symbol id="vp-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol>
  <symbol id="vp-feather" viewBox="0 0 24 24"><path d="M20.5 3.5C13 2 6 8 6 15l-3 6 6-3c7 0 13-7 11.5-14.5Z"/><path d="m4 20 11-11m-5 5-1-4m5 0-1-3"/></symbol>
  <symbol id="vp-chart" viewBox="0 0 24 24"><path d="M4 20V12h4v8m4 0V5h4v15m4 0V9h4v11"/><path d="M2 21h21"/></symbol>
  <symbol id="vp-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.1 1.9-2 2-1.9-1.1-.2.1a7.6 7.6 0 0 1-1.7.7l-.5 2.2h-2.8l-.5-2.2a7.6 7.6 0 0 1-1.7-.7l-.2-.1-1.9 1.1-2-2 1.1-1.9-.1-.2a7.6 7.6 0 0 1-.7-1.7L3 12.7V9.9l2.2-.5a7.6 7.6 0 0 1 .7-1.7l.1-.2L4.9 5.6l2-2 1.9 1.1.2-.1a7.6 7.6 0 0 1 1.7-.7L11.2 1h2.8l.5 2.2a7.6 7.6 0 0 1 1.7.7l.2.1 1.9-1.1 2 2-1.1 1.9.1.2a7.6 7.6 0 0 1 .7 1.7l2.2.5v2.8l-2.2.5a7.6 7.6 0 0 1-.7 1.7Z"/></symbol>
  <symbol id="vp-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
  <symbol id="vp-quote" viewBox="0 0 24 24"><path d="M9 11H4a5 5 0 0 1 5-5v5Zm11 0h-5a5 5 0 0 1 5-5v5ZM4 11v7h5v-7m6 0v7h5v-7"/></symbol>
  <symbol id="vp-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
</svg>
<section id="welcome" class="welcome-screen" aria-label="Entrada do Verso & Prosa">
  <div class="welcome-art" aria-hidden="true">
    <picture>
      <source media="(min-width: 900px)" srcset="./assets/scenes/welcome-desktop-approved.webp">
      <img src="./assets/scenes/welcome-mobile-responsive-v27.webp" alt="">
    </picture>
  </div>
  <button class="welcome-enter-button" id="enterLibrary" type="button"
    aria-label="Entrar na Biblioteca">
    <svg class="welcome-enter-icon" viewBox="0 0 64 48" aria-hidden="true" focusable="false">
      <path d="M5 9.5C15 5 24 6 32 13v29C24 35 15 34 5 38Z"/>
      <path d="M59 9.5C49 5 40 6 32 13v29c8-7 17-8 27-4Z"/>
      <path d="M32 13v29"/>
      <path d="M10 15c7-2 13-.8 18 3M10 22c7-2 13-.8 18 3M36 18c5-3 11-4 18-3M36 25c5-3 11-4 18-3"/>
      <path d="M5 42c10-4 19-3 27 4 8-7 17-8 27-4"/>
    </svg>
    <span>Entrar na Biblioteca</span>
  </button>
  <span class="welcome-enter-ornament" aria-hidden="true">
    <svg viewBox="0 0 180 30" focusable="false">
      <path d="M4 15h48m76 0h48M52 15c9 0 11-10 20-10 7 0 10 6 18 10-8 4-11 10-18 10-9 0-11-10-20-10Zm76 0c-9 0-11-10-20-10-7 0-10 6-18 10 8 4 11 10 18 10 9 0 11-10 20-10Z"/>
      <path d="M90 4c-5 5-5 17 0 22 5-5 5-17 0-22Z"/>
      <path d="M82 15h16M90 2v26"/>
      <circle cx="68" cy="15" r="2"/><circle cx="112" cy="15" r="2"/>
    </svg>
  </span>
</section>
<section id="login" class="login-screen hidden" aria-label="Entrar na biblioteca Verso & Prosa">
  <div class="login-layout" role="region" aria-label="Acesso à biblioteca">
    <div class="login-canvas">
      <img class="login-approved-master" src="./assets/scenes/login-approved-master.png" alt="" aria-hidden="true">
      <div class="login-library-atmosphere" aria-hidden="true"></div>
      <div class="login-bottom-scene" aria-hidden="true"></div>
      <header class="login-brand">
        <img class="login-brand-mark" src="./assets/login-emblem-gold-v5.png" alt="Livro aberto e pena dourados">
        <h1>Verso &amp; Prosa</h1>
        <p>Biblioteca Literária</p>
        <img class="login-brand-ornament login-brand-ornament-classic" src="./assets/ornaments/login-brand-divider.svg" alt="" aria-hidden="true">
      </header>

      <form id="loginForm" class="login-form" autocomplete="on">
        <div class="login-form-frame" aria-hidden="true">
          <img class="login-frame-art" src="./assets/ornaments/login-frame-classic.svg" alt="">
        </div>
        <div class="login-fields">
          <div class="login-field">
            <label class="sr-only" for="email">E-mail</label>
            <svg class="login-field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="E-mail" aria-label="E-mail" required>
          </div>
          <div class="login-field">
            <label class="sr-only" for="senha">Senha</label>
            <svg class="login-field-icon login-lock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            <input id="senha" name="password" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
            <button class="login-eye" id="togglePassword" type="button" aria-label="Mostrar senha" title="Mostrar senha">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/><path class="eye-slash" d="m4 4 16 16"/></svg>
            </button>
          </div>
        </div>
        <button class="login-submit" type="submit">Entrar</button>
        <button class="login-forgot" id="forgotPassword" type="button">Esqueceu sua senha?</button>
        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
<section id="app" class="app-shell hidden">
  <header class="topbar">
    <div class="brand-small">
      <span class="brand-seal"><img src="./assets/brand/verso-emblema.svg" alt=""></span>
      <span class="brand-name">Verso <b>&amp;</b> Prosa <small>Biblioteca Literária</small></span>
    </div>
    <div class="top-actions"><span class="online-mark" aria-hidden="true"></span><span id="profileLabel">Leitor</span><button class="round-btn" id="profileSwitch" aria-label="Sair e trocar de conta">↪</button></div>
  </header>

  <div class="workspace">
    <aside class="library-sidebar" aria-label="Navegação da biblioteca">
      <div class="sidebar-caption">SUA BIBLIOTECA</div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="inicio"><span class="nav-glyph"><svg><use href="#vp-home"/></svg></span>Salão principal</button>
        <button class="nav-item" data-page="estante"><span class="nav-glyph"><svg><use href="#vp-shelf"/></svg></span>Minhas estantes</button>
        <button class="nav-item" data-page="adicionar"><span class="nav-glyph"><svg><use href="#vp-plus"/></svg></span>Adicionar exemplar</button>
        <button class="nav-item" data-page="anotacoes"><span class="nav-glyph"><svg><use href="#vp-pen"/></svg></span>Caderno de leitura</button>
        <button class="nav-item" data-page="descobrir"><span class="nav-glyph"><svg><use href="#vp-compass"/></svg></span>Novas descobertas</button>
        <button class="nav-item" data-page="estudio"><span class="nav-glyph"><svg><use href="#vp-feather"/></svg></span>Ateliê literário</button>
        <button class="nav-item" data-page="calendario"><span class="nav-glyph"><svg><use href="#vp-calendar"/></svg></span>Agenda de leitura</button>
      </nav>
      <div class="sidebar-quote"><span>“</span><p>Um livro é um sonho que seguramos nas mãos.</p><small>— Neil Gaiman</small></div>
      <div class="sidebar-profile"><div class="avatar" id="sidebarAvatar">L</div><div><b id="sidebarName">Leitor</b><small>Acervo pessoal</small></div></div>
    </aside>

    <main>
      <div id="moduleHost" class="module-host" aria-live="polite"></div>
      </main>
  </div>

  <nav class="bottom-nav" aria-label="Menu principal">
    <button class="nav-item" data-page="inicio"><img class="bottom-nav-icon" src="./assets/icons/home-classic/3d-home-arch.png" alt="" aria-hidden="true"><span>Início</span></button>
    <button class="nav-item active" data-page="estante"><img class="bottom-nav-icon" src="./assets/icons/home-classic/3d-book-open.png" alt="" aria-hidden="true"><span>Estante</span></button>
    <button class="nav-item nav-add" data-page="adicionar" aria-label="Adicionar livro"><img class="bottom-nav-plus-icon" src="./assets/icons/home-classic/3d-plus-medallion.png" alt="" aria-hidden="true"></button>
    <button class="nav-item" data-page="descobrir"><img class="bottom-nav-icon" src="./assets/icons/home-classic/3d-magnifier.png" alt="" aria-hidden="true"><span>Descobrir</span></button>
    <button class="nav-item" data-page="mais"><img class="bottom-nav-icon" src="./assets/icons/home-classic/3d-sliders.png" alt="" aria-hidden="true"><span>Mais</span></button>
  </nav>
</section>

<div id="overlayModuleHost"></div>
<div id="toast" class="toast" role="status"></div>
<script src="./modules/module-loader.js?v=modular-v54"></script>
<script src="./app.js?v=modular-v54"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));}</script>
</body>
</html>
