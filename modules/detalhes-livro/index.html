<!-- Versos & Narrativas | Módulo: Detalhes do Livro -->
<dialog id="bookDialog" class="book-dialog">
  <div class="dialog-top"><span class="eyebrow">DETALHES DO LIVRO</span><button type="button" class="dialog-close" id="closeBookDialog" aria-label="Fechar">×</button></div>
  <div class="book-detail">
    <div class="detail-cover" id="detailCover"><span>V&amp;P</span></div>
    <div class="detail-main"><span class="status-label" id="detailStatus">NO ACERVO</span><h2 id="detailTitle">Título do livro</h2><p id="detailAuthor" class="detail-author">Autor</p><p id="detailGenre" class="detail-genre"></p></div>
  </div>
  <div class="detail-rule"></div>
  <div class="detail-meta" id="detailMeta"></div>
  <p class="detail-note">Este exemplar faz parte da sua biblioteca particular. Abra o caderno para registrar impressões, perguntas e passagens marcantes.</p>
  <button class="primary" id="detailNoteButton">Escrever no caderno sobre este livro</button>
</dialog>
